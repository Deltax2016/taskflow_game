server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Проксируем запросы API на бэкенд (имя сервиса из docker-compose).
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # SPA: любые пути отдаём index.html, роутинг делает React Router.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
