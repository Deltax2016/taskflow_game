server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Загрузка файлов до 5 МБ (игровой режим). Дефолт nginx — 1 МБ, и без
    # этой строки файл на 5 МБ отваливается с 413 ещё до бэкенда, где стоит
    # настоящий лимит. Берём с запасом на overhead multipart-формы.
    client_max_body_size 6m;

    # Проксируем запросы API на бэкенд (имя сервиса из docker-compose).
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Агент ходит в LLM и внешние API — один запрос может занять десятки
        # секунд, дефолтных 60 с под нагрузкой на занятии не всегда хватает.
        proxy_read_timeout 120s;
    }

    # SPA: любые пути отдаём index.html, роутинг делает React Router.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
